const app=document.querySelector('#app'),pageTitle=document.querySelector('#pageTitle'),nav=[...document.querySelectorAll('.bottomNav button')];
const save=()=>localStorage.setItem(LS,JSON.stringify(state));
const token=()=>localStorage.getItem(TOKEN_KEY)||'';
(()=>{const u=new URL(location.href),t=u.searchParams.get('invite');if(t){localStorage.setItem(TOKEN_KEY,t);u.searchParams.delete('invite');history.replaceState(null,'',u.pathname+u.search+u.hash)}})();
const day=()=>DAYS.find(d=>d.date===state.day)||DAYS[0];
const fmtDate=s=>new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ}).format(new Date(s+'T12:00:00-04:00'));
const today=()=>new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:TZ}).format(new Date());
const currentMinutes=()=>{const ps=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:false,timeZone:TZ}).formatToParts(new Date());let h=+ps.find(p=>p.type==='hour').value,m=+ps.find(p=>p.type==='minute').value;if(h===24)h=0;return h*60+m};
const toMinutes=t=>{const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return 9999;let h=+m[1],mi=+m[2];if(m[3].toUpperCase()==='PM'&&h!==12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0;return h*60+mi};
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function syncBadge(){if(sync==='synced')return '<span class="chip good">'+icon('check')+'Synced</span>';if(sync==='offline')return '<span class="chip warn">Offline · local safe</span>';if(token())return '<span class="chip blue">Syncing…</span>';return '<span class="chip">Local only</span>'}
async function syncReq(payload){if(!token())return null;const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({...payload,tripId:TRIP,token:token()})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Sync failed');return j}
function rerenderPreserveScroll(){const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}
async function pull(){if(!token()){sync='local';rerenderPreserveScroll();return}try{const j=await syncReq({action:'get'});for(const row of(j.rows||[])){state.status[row.event_id]=row.status||'';state.notes[row.event_id]=row.note||''}save();sync='synced'}catch(e){sync='offline'}rerenderPreserveScroll()}
async function push(id){if(!token())return;try{await syncReq({action:'update',eventId:id,status:state.status[id]||'',note:state.notes[id]||'',updatedBy:'phone'});sync='synced'}catch(e){sync='offline'}}
function progress(d){const total=d.events.length,done=d.events.filter(e=>state.status[e.id]==='completed').length;return{total,done,pct:Math.round(done/total*100)}}
function nextEvent(d){if(today()!==d.date)return null;const n=currentMinutes();return d.events.find(e=>toMinutes(e.time)>=n&&!['completed','skipped'].includes(state.status[e.id]))||null}
function dayStrip(){return `<div class="dayStrip">${DAYS.map(d=>{const t=parkTheme[d.type];return `<button class="dayCard ${d.date===state.day?'active':''}" data-day="${d.date}" style="--dayAccent:${t.accent};--dayGlow:${t.glow}"><span class="dayDate">${fmtDate(d.date)}</span><span class="dayIcon">${icon(t.icon)}</span><strong>${d.name}</strong><small>${d.subtitle}</small></button>`}).join('')}</div>`}
function weatherCard(d){if(!weather)return `<div class="weather"><div class="weatherMain">${icon('weather')}<div><strong>Orlando weather</strong><div class="weatherMeta">Loading live forecast…</div></div></div></div>`;const w=weather.find(x=>x.date===d.date);if(!w)return `<div class="weather"><strong>Forecast not in range yet</strong></div>`;let advice='No major weather-driven change suggested.';if(w.rain>=60)advice='Higher rain risk: keep indoor shows, meals and flexible attractions available for the wettest part of the day.';else if(w.max>=92)advice='Heat is the bigger issue: use indoor shows and meals as recovery blocks and keep Vihaan hydrated.';return `<div class="weather"><div class="weatherRow"><div class="weatherMain">${icon('weather')}<div><div class="temp">${Math.round(w.max)}°F</div><div class="weatherMeta">Low ${Math.round(w.min)}° · Rain ${w.rain}%</div></div></div><span class="chip ${w.rain>=60?'warn':'good'}">${w.rain>=60?'Rain plan':'Weather check'}</span></div><div class="weatherAdvice">${advice}</div></div>`}
function nowCard(d){const n=nextEvent(d);return n?`<div class="nowCard">${icon('clock')}<div><strong>Next · ${n.time}</strong><span>${n.title}</span></div></div>`:''}
function hero(d,overview=false){const t=parkTheme[d.type],p=progress(d);return `<section class="hero" style="--park:${t.accent};--heroGlow:${t.glow}"><div class="heroTop"><div><div class="eyebrow">${overview?'Aakash · Preeti · Vihaan':fmtDate(d.date)+' · '+d.hours}</div><h2>${overview?'Your Disney trip, ready to go.':d.name}</h2><p>${overview?'Your confirmed dining and Lightning Lane bookings are locked in. Everything else is arranged around those anchors, location and Vihaan’s 92 cm height.':d.subtitle}</p></div><div class="heroIcon">${icon(t.icon)}</div></div><div class="chips"><span class="chip blue">${d.ll.length?d.ll.length+' confirmed':'No confirmed bookings'}</span><span class="chip good">${p.done}/${p.total} complete</span>${syncBadge()}</div>${nowCard(d)}<div class="heroArt"></div></section>`}
function llSection(d){if(!d.ll.length)return '';return `<section class="section"><div class="sectionHead"><h3>Confirmed bookings</h3><span>Hard anchors · My Disney Experience</span></div><div class="llBox">${d.ll.map(x=>`<div class="llItem ${x.kind==='Dining'?'dining':''}"><div class="llTime">${x.time}</div><div><strong>${x.name}</strong><small>${x.note}</small></div></div>`).join('')}</div></section>`}
function tagClass(t){if(t==='LL')return 'll';if(t==='Must')return 'must';if(t==='Food')return 'food';return ''}
function eventCard(d,e){const s=state.status[e.id]||'',n=nextEvent(d)?.id===e.id;return `<article class="event ${s==='completed'?'done':s==='skipped'?'skip':''} ${n?'next':''}"><div class="eventTop"><div><div class="eventTime">${e.time}</div><h4>${e.title}</h4></div>${n?'<span class="chip blue">NEXT</span>':s==='completed'?'<span class="chip good">Done</span>':s==='skipped'?'<span class="chip red">Skipped</span>':''}</div><p>${e.desc}</p><div class="eventMeta">${e.tags.map(t=>`<span class="miniTag ${tagClass(t)}">${t}</span>`).join('')}</div><div class="actions"><a class="btn primary" target="_blank" href="${mapRoute(e.loc)}">${icon('map')}Route</a><button class="btn good" data-act="completed" data-id="${e.id}">${icon('check')}Complete</button><button class="btn danger" data-act="skipped" data-id="${e.id}">${icon('skip')}Skip</button><button class="btn" data-note="${e.id}">${icon('note')}Note</button></div><div class="note ${state.notes[e.id]?'open':''}" id="note-${e.id}"><textarea data-text="${e.id}" placeholder="Add a quick note…">${state.notes[e.id]||''}</textarea></div></article>`}
function home(){const d=DAYS.find(x=>x.date===today())||day();pageTitle.textContent='Trip Overview';app.innerHTML=`${hero(d,true)}<section class="section"><div class="sectionHead"><h3>Six-day plan</h3><span>Tap any day</span></div>${dayStrip()}</section><section class="section"><div class="metrics"><div class="metric"><strong>92 cm</strong><span>Vihaan height</span></div><div class="metric"><strong>16</strong><span>Total confirmed bookings</span></div><div class="metric"><strong>4</strong><span>Theme parks</span></div><div class="metric"><strong>6:50 PM</strong><span>Flight home Sep 23</span></div></div></section><section class="section"><div class="sectionHead"><h3>Weather coach</h3><span>Live Orlando forecast</span></div>${weatherCard(d)}</section>`;bind()}
function renderDay(d=day()){state.day=d.date;save();const p=progress(d);pageTitle.textContent=d.name;app.innerHTML=`${hero(d)}<section class="section">${weatherCard(d)}</section>${llSection(d)}<section class="section"><div class="panel"><div class="progress"><span style="width:${p.pct}%"></span></div><div class="progressMeta"><span>${p.done} completed</span><span>${p.pct}% of day</span></div></div></section><section class="section"><div class="sectionHead"><h3>Optimized timeline</h3><span>Built around your confirmed reservation times</span></div><div class="timeline">${d.events.map(e=>eventCard(d,e)).join('')}</div></section>`;bind()}
function daysView(){pageTitle.textContent='All Days';app.innerHTML=`<section class="section">${dayStrip()}</section><section class="section"><div class="list">${DAYS.map(d=>{const t=parkTheme[d.type],p=progress(d);return `<button class="listItem" data-day="${d.date}" style="width:100%;text-align:left;color:inherit"><span style="color:${t.accent}">${icon(t.icon)}</span><div><strong>${fmtDate(d.date)} · ${d.name}</strong><p>${d.subtitle} · ${p.done}/${p.total} complete</p></div></button>`}).join('')}</div></section>`;bind()}
function routesView(){pageTitle.textContent='Routes';const a=[['Art of Animation',HOTEL],['MCO',MCO],['Animal Kingdom','Disney Animal Kingdom'],['Hollywood Studios','Disney Hollywood Studios'],['Magic Kingdom','Magic Kingdom Park'],['EPCOT International Gateway','EPCOT International Gateway'],['Blizzard Beach','Disney Blizzard Beach Water Park']];app.innerHTML=`<section class="hero"><div class="heroTop"><div><div class="eyebrow">Navigation</div><h2>One-tap route shortcuts</h2><p>For walking inside a park, My Disney Experience remains the best live park map. These shortcuts handle the big transfers.</p></div><div class="heroIcon">${icon('route')}</div></div><div class="heroArt"></div></section><section class="section"><div class="list">${a.map(x=>`<div class="listItem">${icon('pin')}<div><strong>${x[0]}</strong><p>${x[1]}</p><div class="actions"><a class="btn primary" target="_blank" href="${mapRoute(x[1])}">${icon('route')}Navigate</a></div></div></div>`).join('')}</div></section>`}
function foodView(){pageTitle.textContent='Food';app.innerHTML=`<section class="hero" style="--park:#b9821a;--heroGlow:#fff0c8"><div class="heroTop"><div><div class="eyebrow">Dining Plan</div><h2>Confirmed meals first.</h2><p>Your two table-service breakfasts are fixed anchors. Other meals stay flexible so they do not compete with Lightning Lane windows.</p></div><div class="heroIcon">${icon('food')}</div></div><div class="chips"><span class="chip good">Chef Mickey’s · 7:35 AM</span><span class="chip good">Garden Grill · 9:25 AM</span></div><div class="heroArt"></div></section><section class="section"><div class="list"><div class="listItem">${icon('food')}<div><strong>Sep 21 · Chef Mickey’s · 7:35 AM</strong><p>CONFIRMED at Disney’s Contemporary Resort. Use rideshare from Art of Animation, then walk/monorail to Magic Kingdom.</p></div></div><div class="listItem">${icon('food')}<div><strong>Sep 22 · Garden Grill · 9:25 AM</strong><p>CONFIRMED character breakfast in The Land pavilion. Living with the Land moves immediately after because it is in the same building.</p></div></div><div class="listItem">${icon('food')}<div><strong>Animal Kingdom · ~11:45 AM</strong><p>Flexible lunch near Africa before the 1:30 PM Safari anchor.</p></div></div><div class="listItem">${icon('food')}<div><strong>Sep 20 · 50’s Prime Time Cafe · 10:45 AM</strong><p>CONFIRMED table-service lunch. It sits between the 9:30 AM Frozen show and the 11:35 AM Runaway Railway return window.</p></div></div></div></section>`}
function moreView(){pageTitle.textContent='More';app.innerHTML=`<section class="section"><div class="list"><div class="listItem">${icon('home')}<div><strong>Disney’s Art of Animation Resort</strong><p>The Little Mermaid Standard Room · checkout 11:00 AM Sep 23.</p></div></div><div class="listItem">${icon('refresh')}<div><strong>Shared trip sync</strong><p>Complete/Skip and notes persist locally first, then sync to Supabase when connected.</p><div class="chips">${syncBadge()}</div></div></div><div class="listItem">${icon('star')}<div><strong>Planning rule</strong><p>Booked Lightning Lanes are fixed. Major attractions Vihaan can ride are prioritized. Optional rests are the first thing to drop if they cause you to miss a major attraction.</p></div></div></div></section>`}
function render(){nav.forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='day'&&b.dataset.view==='days')));if(view==='home')home();else if(view==='days')daysView();else if(view==='day')renderDay();else if(view==='routes')routesView();else if(view==='food')foodView();else moreView()}
function bind(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;view='day';renderDay()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,v=b.dataset.act;state.status[id]=state.status[id]===v?'':v;save();renderDay();push(id)});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>document.querySelector('#note-'+b.dataset.note)?.classList.toggle('open'));document.querySelectorAll('[data-text]').forEach(t=>t.oninput=()=>{state.notes[t.dataset.text]=t.value;save();clearTimeout(t._timer);t._timer=setTimeout(()=>push(t.dataset.text),650)})}
async function loadWeather(show=false){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=28.3852&longitude=-81.5639&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=8'),j=await r.json();weather=j.daily.time.map((d,i)=>({date:d,max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],rain:j.daily.precipitation_probability_max[i]||0}));localStorage.setItem('dw26-weather-v7',JSON.stringify(weather));rerenderPreserveScroll();if(show)toast('Weather refreshed')}catch(e){try{weather=JSON.parse(localStorage.getItem('dw26-weather-v7'))}catch{}rerenderPreserveScroll()}}
nav.forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelector('#refreshBtn').onclick=()=>{sync=token()?'syncing':'local';render();Promise.allSettled([loadWeather(true),pull()])};render();loadWeather();pull();setInterval(()=>{if(document.visibilityState==='visible'&&token())pull()},7000);

</script>
</body>
</html>
