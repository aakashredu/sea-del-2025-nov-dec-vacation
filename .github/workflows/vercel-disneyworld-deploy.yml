name: Temporary DisneyWorld Vercel Deploy

on:
  push:
    branches:
      - temp-disneyworld-v3-import

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59.20.0

      - name: Prepare DisneyWorld v3
        shell: bash
        run: |
          mkdir -p site
          cp disneyworld-v3.html site/index.html
          printf '%s\n' '{"cleanUrls":true}' > site/vercel.json
          test -s site/index.html
          echo "Prepared $(wc -c < site/index.html) byte frontend."

      - name: Authenticate to Vercel and deploy production
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          echo "VERCEL_DEVICE_AUTH_START"
          timeout 10m script -q -e -c "env -u CI vercel login --no-color" /dev/null
          echo "VERCEL_DEVICE_AUTH_DONE"
          vercel link --yes --project disneyworld --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
          echo "VERCEL_LINK_DONE"
          vercel deploy --prod --yes --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
          echo "VERCEL_DEPLOY_DONE"
