name: Temporary DisneyWorld Vercel Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vercel-disneyworld-deploy.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59.20.0

      - name: Prepare DisneyWorld v3
        shell: bash
        run: |
          mkdir -p site
          cp deployment-temp/disneyworld-v3.html site/index.html
          printf '%s\n' '{"cleanUrls":true}' > site/vercel.json
          test -s site/index.html
          echo "Prepared $(wc -c < site/index.html) byte frontend."

      - name: Authenticate to Vercel and deploy production
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          rm -f /tmp/vercel-login.log
          timeout 10m script -q -f -c "env -u CI vercel login --no-color" /tmp/vercel-login.log &
          LOGIN_PID=$!

          for i in $(seq 1 30); do
            if grep -Eqi 'https://vercel.com|user[_ -]?code|verification' /tmp/vercel-login.log 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cp /tmp/vercel-login.log deployment-temp/vercel-login.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-temp/vercel-login.txt
          git commit -m "Publish temporary Vercel device login instructions" || true
          git push origin HEAD:main

          wait "$LOGIN_PID"

          vercel link --yes --project disneyworld --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
          vercel deploy --prod --yes --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
