name: Temporary DisneyWorld Vercel Deploy

on:
  push:
    branches:
      - temp-disneyworld-v3-import

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59.20.0

      - name: Prepare DisneyWorld v3
        shell: bash
        run: |
          mkdir -p site
          cp disneyworld-v3.html site/index.html
          printf '%s\n' '{"cleanUrls":true}' > site/vercel.json
          test -s site/index.html

      - name: Authenticate to Vercel
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          rm -f vercel-login.log vercel-device-auth.txt
          script -q -f -c "env -u CI vercel login --no-color" vercel-login.log &
          LOGIN_PID=$!
          for i in $(seq 1 40); do
            URL=$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' vercel-login.log | tail -1 || true)
            if [ -n "$URL" ]; then
              printf '%s\n' "$URL" > vercel-device-auth.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add vercel-device-auth.txt
              git commit -m "[skip ci] Publish temporary Vercel device auth URL"
              git push origin HEAD:temp-disneyworld-v3-import
              break
            fi
            sleep 1
          done
          test -s vercel-device-auth.txt
          timeout 9m tail --pid=$LOGIN_PID -f /dev/null || true
          wait $LOGIN_PID

      - name: Deploy DisneyWorld v3 to production
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          vercel link --yes --project disneyworld --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
          vercel deploy --prod --yes --scope aakashrd9868-gmailcoms-projects --cwd site --no-color
